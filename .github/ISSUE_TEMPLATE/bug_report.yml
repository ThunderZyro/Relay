name: Bug report
description: Report a reproducible problem in Relay.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please do not include passwords, session cookies, private messages, personal data, or API keys.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps using a test account and non-production data.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Accounts and profiles
        - Direct messages
        - Communities and channels
        - Voice and realtime
        - Uploads and files
        - Desktop app
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or desktop version
      placeholder: Browser name/version or Relay Desktop version
  - type: textarea
    id: logs
    attributes:
      label: Relevant error message (redacted)
      description: Remove tokens, email addresses, and private user data before sharing.
