name: Feature request
description: Suggest an improvement or new Relay feature.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the situation or user need.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Relay to do?
      description: Describe the behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternatives or related products you have considered?
