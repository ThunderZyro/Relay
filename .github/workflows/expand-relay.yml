name: Expand Relay source
on:
  push:
    paths:
      - "relay-platform-rebuilt.zip"
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Expand project
        run: |
          mkdir -p /tmp/relay-source
          unzip -q relay-platform-rebuilt.zip -d /tmp/relay-source
          test -f /tmp/relay-source/relay-platform/package.json
          cp -a /tmp/relay-source/relay-platform/. .
          rm -f relay-platform-rebuilt.zip
      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add rebuilt Relay source"
          git push
