name: Build Relay Desktop

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release-desktop.yml'
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify complete source tree
        shell: pwsh
        run: |
          $required = @(
            'client/package.json',
            'server/package.json',
            'desktop/main.cjs',
            'desktop/electron-builder.config.cjs',
            'shared/types.ts'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            throw ("The repository is missing required Relay source files: " + ($missing -join ', '))
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and test Relay
        run: |
          npm run build
          npm test

      - name: Build Windows installer
        run: npx electron-builder --config desktop/electron-builder.config.cjs --win nsis --x64 --publish never

      - name: Publish installer to GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $($env:GITHUB_REF_NAME) must match package.json version $tag."
          }
          $assets = @(
            Get-ChildItem 'release/desktop/Relay-Setup-*.exe' -ErrorAction SilentlyContinue
            Get-ChildItem 'release/desktop/*.blockmap' -ErrorAction SilentlyContinue
            Get-Item 'release/desktop/latest.yml' -ErrorAction SilentlyContinue
          )
          if ($assets.Count -eq 0 -or -not ($assets.Name -match '^Relay-Setup-.*\.exe$')) {
            throw "The installer EXE was not generated in release/desktop."
          }
          $assetPaths = @($assets | ForEach-Object { $_.FullName })
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assetPaths --clobber --repo $env:GH_REPO
          } else {
            gh release create $tag @assetPaths --title "Relay $version" --notes "Relay Desktop Windows x64 installer." --target $env:GITHUB_SHA --repo $env:GH_REPO
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release upload failed for $tag."
          }

      - name: Keep installer artifacts available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-desktop-windows
          path: release/desktop/*
          if-no-files-found: ignore
